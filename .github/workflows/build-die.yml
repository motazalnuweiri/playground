name: Build Detect It Easy (Qt5)

env:
  TAG: "3.21"
  
on:
  workflow_dispatch:
  release:
    types: [created]
  
jobs:

  ubuntu-arm:
    name: Ubuntu arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Clone DIE repository
        run: |
          git clone --depth 1 --recursive \
            --branch ${{ env.TAG }} \
            https://github.com/horsicq/DIE-engine.git .

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          
          apt-get install -y \
            build-essential \
            qtbase5-dev \
            qtscript5-dev \
            qttools5-dev-tools \
            libqt5svg5-dev \
            qtchooser \
            qt5-qmake

      - name: Patch build scripts
        run: |
          sed -i \
            '/^# Build DEBIAN\/control$/a\
          DEPS=$(dpkg-shlibdeps -O \
              "$WORK_DIR/usr/bin/die" \
              "$WORK_DIR/usr/bin/diec" \
              "$WORK_DIR/usr/bin/diel" | \
              sed -n '\''s/^shlibs:Depends=//p'\'')' \
            build_dpkg.sh
    
          sed -i \
            's/^Depends: .*$/Depends: ${DEPS}/' \
            build_dpkg.sh

      - name: Build DIE DEB package
        run: |
          bash -x build_dpkg.sh

      - name: Upload DIE DEB
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: die-linux-arm64-artifact
          path: |
            release/*.deb