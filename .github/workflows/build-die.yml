name: Build Detect It Easy (Qt6)

env:
  TAG: "3.21"

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:

  ubuntu-arm:
    name: Ubuntu arm64
    runs-on: ubuntu-26.04-arm

    container:
      image: ubuntu:25.10

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install bootstrap dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            git \
            ca-certificates
      
      - name: Clone DIE repository
        run: |
          git clone --depth 1 --recursive \
            --branch ${{ env.TAG }} \
            https://github.com/horsicq/DIE-engine.git .
          
      - name: Install build dependencies
        run: |
          apt-get update

          apt-get install -y \
            build-essential \
            cmake \
            dpkg-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev-tools \
            qt6-5compat-dev \
            libqt6svg6-dev \
            qt6-declarative-dev

      - name: Build DIE
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"

      - name: Build DIE DEB package
        run: |
          VERSION=$(cat release_version.txt)
          ARCH=$(dpkg --print-architecture)

          mkdir -p \
            package/DEBIAN \
            package/usr/bin \
            package/usr/lib/die \
            package/usr/share/applications \
            package/usr/share/icons \
            package/usr/share/metainfo

          # Binaries
          cp build/gui/die package/usr/bin/
          cp build/console/diec package/usr/bin/
          cp build/lite/diel package/usr/bin/

          # DIE databases
          cp -r db package/usr/lib/die/
          cp -r db_custom package/usr/lib/die/

          # Extra databases, if present
          if [ -d db_extra ]; then
            cp -r db_extra package/usr/lib/die/
          fi

          # Languages
          if [ -d lang ]; then
            cp -r lang package/usr/lib/die/
          fi

          # Generate runtime dependencies
          DEPS=$(dpkg-shlibdeps -O \
            package/usr/bin/die \
            package/usr/bin/diec \
            package/usr/bin/diel 2>/dev/null |
            sed -n 's/^shlibs:Depends=//p')

          echo "Dependencies:"
          echo "$DEPS"

          cat > package/DEBIAN/control <<EOF
          Package: detectiteasy
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: hors <horsicq@gmail.com>
          Homepage: http://ntinfo.biz
          Section: devel
          Priority: optional
          Depends: ${DEPS}
          Description: Detect It Easy is a program for determining types of files.
           Detect It Easy is a program for determining types of files.
          EOF

          dpkg-deb --build \
            package "die_${VERSION}_ubuntu25.10_${ARCH}.deb"

      - name: Verify DEB package
        run: |
          dpkg-deb --info die_*.deb
          dpkg-deb --contents die_*.deb

      - name: Upload DIE DEB
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: die-linux-arm64-deb
          path: |
            *.deb