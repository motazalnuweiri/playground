name: Build Cutter (Qt6)

env:
  TAG: "v2.4.1"

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-linux-arm64:
    name: linux-arm64
    runs-on: ubuntu-26.04-arm

    # Run the entire build inside Ubuntu 25.10 ARM64.
    container:
      image: ubuntu:25.10

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:

    - name: Set timezone
      run: |
        export TZ=UTC
        ln -snf /usr/share/zoneinfo/$TZ /etc/localtime
        echo $TZ > /etc/timezone

    - name: Install bootstrap dependencies
      shell: bash
      run: |
        apt-get update
        apt-get install -y \
          git \
          ca-certificates

    - name: Clone cutter repository (stable branch)
      run: |
        git clone --depth 1 --recursive --branch ${{ env.TAG }} https://github.com/rizinorg/cutter.git .

        git config --global --add safe.directory "$(pwd)"
        git config --global --add safe.directory "$(pwd)/rizin"

    - name: Fix git subprojects problems
      shell: bash
      run: |
        rm -rf build
        git submodule foreach --recursive git reset --hard
        git submodule foreach --recursive git clean -dxff

        cd rizin
        git clean -dxff subprojects/

    - name: Fix file options dialog height
      shell: bash
      run: |
        # We used 'diff -e basefile changedfile > patch.txt'
        # than we create 'sed' commands base on patch.txt
        sed -i \
          -e '10c\    <height>684</height>' \
          -e '14c\   <sizepolicy hsizetype="Minimum" vsizetype="Preferred">' \
          -e '22c\    <height>500</height>' \
          -e '119c\      <sizepolicy hsizetype="Minimum" vsizetype="Preferred">' \
          -e '421c\           <height>310</height>' \
          -e '473c\                <enum>QLayout::SetDefaultConstraint</enum>' \
          src/dialogs/InitialOptionsDialog.ui

    - name: Install build dependencies
      run: |
        apt-get update

        # Install basic tools
        apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          dpkg-dev \
          git \
          curl \
          ca-certificates \
          file \
          mesa-common-dev \
          libxkbcommon-x11-dev \
          libxkbcommon-dev \
          libx11-dev \
          libwayland-dev \
          libpcre2-dev \
          libfuse2 \
          meson \
          libxerces-c-dev \
          clang \
          llvm \
          libclang-dev

        # Install Python 3
        apt-get install -y \
          python3 \
          python3-dev \
          python3-venv \
          pyside6-tools \
          libpyside6-dev \
          shiboken6 \
          libshiboken6-dev

        # Install Qt6
        apt-get install -y \
          qt6-base-dev \
          qt6-tools-dev \
          qt6-base-dev-tools \
          qt6-tools-dev-tools \
          qt6-l10n-tools \
          libqt6svg6-dev \
          libqt6core5compat6-dev \
          qt6-declarative-dev \
          qt6-declarative-dev-tools \
          qml6-module-qtquick-controls \
          libqt6core5compat6

        # Install Cutter dependencies
        apt-get install -y \
          libgraphviz-dev \
          libkf6syntaxhighlighting-dev \
          libegl1-mesa-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libxkbcommon-dev \
          libx11-dev \
          libwayland-dev

        # Install Rizin dependencies
        apt-get install -y \
          libcapstone-dev \
          liblz4-dev \
          liblzma-dev \
          libmagic-dev \
          libzip-dev \
          libxxhash-dev \
          libssl-dev \
          libsqlite3-dev \
          libzstd-dev

    - name: Show build environment
      shell: bash
      run: |
        echo "=== OS ==="
        cat /etc/os-release

        echo
        echo "=== Architecture ==="
        uname -m
        dpkg --print-architecture

        echo
        echo "=== Python ==="
        python3 --version

        echo
        echo "=== Qt ==="
        apt-cache policy qt6-base-dev

        echo
        echo "=== PySide6 ==="
        python3 -c "import PySide6; print(PySide6.__version__)"

        echo
        echo "=== Shiboken6 ==="
        python3 -c "import shiboken6; print(shiboken6.__version__)"

        echo
        echo "=== Graphviz ==="
        apt-cache policy libgraphviz-dev

    - name: Build Rizin
      shell: bash
      run: |
        cd rizin
    
        meson setup build \
          --prefix=/usr \
          --libdir=lib \
          --buildtype=release
    
        ninja -C build
    
        rm -rf "$GITHUB_WORKSPACE/rizin-appdir"
    
        DESTDIR="$GITHUB_WORKSPACE/rizin-appdir" \
          ninja -C build install

    - name: Package Rizin DEB package
      shell: bash
      run: |
        export LD_LIBRARY_PATH="$PWD/rizin-appdir/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    
        VERSION=$(rizin-appdir/usr/bin/rizin -v | awk 'NR==1 {print $2}')
        ARCH=$(dpkg --print-architecture)
    
        echo "Rizin version: ${VERSION}"
        echo "Architecture: ${ARCH}"
    
        mkdir -p rizin-deb/DEBIAN
    
        cat > rizin-deb/DEBIAN/control <<EOF
        Package: rizin
        Version: ${VERSION}
        Architecture: ${ARCH}
        Maintainer: RizinOrg <info@rizin.re>
        Section: devel
        Priority: optional
        Description: UNIX-like reverse engineering framework
         Rizin is a UNIX-like reverse engineering framework and command-line
         toolset.
        EOF
    
        cp -a rizin-appdir/usr rizin-deb/
    
        dpkg-deb --build rizin-deb "rizin_${VERSION}_${ARCH}.deb"
    
        echo
        echo "=== Rizin DEB ==="
        ls -lh rizin_*.deb

    - name: Install Rizin DEB package
      shell: bash
      run: |
        apt-get install -y ./rizin_*.deb

        echo "=== Installed Rizin ==="
        rizin -v

        echo
        echo "=== Rizin pkg-config ==="
        pkg-config --modversion rz_core
        pkg-config --variable=prefix rz_core

        echo
        echo "=== Rizin themes ==="
        ls -la /usr/share/rizin/cons | head

    - name: Configure & build Cutter
      shell: bash
      run: |
        export LANG=C.UTF-8
        export LC_ALL=C.UTF-8

        # Fix ExternalProject include
        sed -i '1i include(ExternalProject)' dist/CMakeLists.txt

        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCUTTER_QT=6 \
          -DCUTTER_USE_BUNDLED_RIZIN=OFF \
          -DCUTTER_ENABLE_PYTHON=ON \
          -DCUTTER_ENABLE_PYTHON_BINDINGS=ON \
          -DCUTTER_ENABLE_GRAPHVIZ=ON \
          -DCUTTER_ENABLE_KSYNTAXHIGHLIGHTING=ON \
          -DCUTTER_ENABLE_SIGDB=ON \
          -DCUTTER_ENABLE_PACKAGING=ON \
          -DCUTTER_ENABLE_DEPENDENCY_DOWNLOADS=ON \
          -DCUTTER_PACKAGE_RZ_GHIDRA=ON \
          -DCUTTER_PACKAGE_JSDEC=ON \
          -DCUTTER_PACKAGE_RZ_LIBSWIFT=ON \
          -DCUTTER_PACKAGE_RZ_LIBYARA=ON \
          -DCUTTER_PACKAGE_RZ_SILHOUETTE=ON \
          -DCMAKE_INSTALL_PREFIX=appdir/usr \
          -DCMAKE_INSTALL_RPATH="\$ORIGIN/../lib" \
          -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
          -DCPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON

        cd build
        ninja
        ninja install

    - name: Build Cutter DEB package
      shell: bash
      run: |
        APP_PREFIX="$PWD/appdir/usr"
        export PATH=${APP_PREFIX}/bin:$PATH
        export LD_LIBRARY_PATH=${APP_PREFIX}/lib:${APP_PREFIX}/lib/rizin/plugins:$LD_LIBRARY_PATH
        export LANG=C.UTF-8
        export LC_ALL=C.UTF-8

        cd build

        cpack -G DEB \
          -D CPACK_DEBIAN_PACKAGE_DEPENDS="rizin (>= 0.8.1)" \
          -D CPACK_PACKAGE_CONTACT="RizinOrg <info@rizin.re>" \
          -D CPACK_DEBIAN_PACKAGE_HOMEPAGE="https://cutter.re" \
          -D CPACK_PACKAGE_DESCRIPTION_SUMMARY="GUI for rizin reverse engineering framework" \
          -D CPACK_DEBIAN_PACKAGE_DESCRIPTION="Cutter is a Qt based GUI for reverse engineering binaries, which makes
         use of the rizin framework. Advanced users are expected to use the
         rizin CLI tools instead, which are much more powerful."

        DEB_FILE=$(ls *.deb | head -n1)

        echo "DEB_NAME=$DEB_FILE" >> $GITHUB_ENV

        echo
        echo "=== Generated DEB ==="
        ls -lh "$DEB_FILE"

    - name: Verify DEB dependencies
      shell: bash
      run: |
        cd build

        echo "=== Package architecture ==="
        dpkg-deb -f *.deb Architecture

        echo
        echo "=== Package dependencies ==="
        dpkg-deb -f *.deb Depends

        echo
        echo "=== Package information ==="
        dpkg-deb -I *.deb | head -40

    - uses: actions/upload-artifact@v4
      with:
        name: linux-arm64-artifacts
        path: |
          rizin_*.deb
          build/*.deb

    - name: Upload release asset
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          rizin_*.deb
          build/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}